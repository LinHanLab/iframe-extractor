name: Build Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: iframe-extractor
            archive: iframe-extractor-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            output: iframe-extractor
            archive: iframe-extractor-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            output: iframe-extractor
            archive: iframe-extractor-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            output: iframe-extractor
            archive: iframe-extractor-darwin-arm64.tar.gz
          - goos: windows
            goarch: amd64
            output: iframe-extractor.exe
            archive: iframe-extractor-windows-amd64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o ${{ matrix.output }}

      - name: Create archive (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          tar -czf ${{ matrix.archive }} ${{ matrix.output }}

      - name: Create archive (zip)
        if: matrix.goos == 'windows'
        run: |
          zip ${{ matrix.archive }} ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 7

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
